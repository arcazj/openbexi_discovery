name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'installer/**'
      - 'scripts/build_windows.py'
      - 'scripts/test_windows_install.py'
      - 'backend/**'
      - 'assets/**'
      - 'themes/**'
      - 'templates/**'
      - 'prompts/runtime/**'
      - 'schemas/**'
      - 'documentation/**'
      - 'requirements.lock.txt'
      - 'index.html'
      - 'licenses/**'
      - '*.md'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            installer/requirements-build.txt
      - run: python -m pip install -r requirements.lock.txt -r installer/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.build_windows
      - run: python -m scripts.test_windows_install
      - name: Verify upgrade from the published V1.0 installer
        shell: pwsh
        run: |
          $previousDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/windows/previous'
          New-Item -ItemType Directory -Path $previousDirectory -Force | Out-Null
          $previousName = 'REIResearchExplorer-1.0.0-Windows-x64-Setup.exe'
          $previousInstaller = Join-Path $previousDirectory $previousName
          $previousChecksum = Join-Path $previousDirectory 'SHA256SUMS-Windows.txt'
          $previousRelease = 'https://github.com/arcazj/openbexi_REI/releases/download/v1.0.0/'
          Invoke-WebRequest -Uri ($previousRelease + $previousName) -OutFile $previousInstaller
          Invoke-WebRequest -Uri ($previousRelease + 'SHA256SUMS-Windows.txt') -OutFile $previousChecksum
          $expected = (Get-Content -LiteralPath $previousChecksum -Raw).Trim() -split '\s+'
          if ($expected.Count -ne 2 -or $expected[1] -ne $previousName) { throw 'Unexpected previous installer checksum contents.' }
          $actualHash = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash
          if ($actualHash -ne $expected[0]) { throw 'Previous installer checksum mismatch.' }
          python -m scripts.test_windows_install --previous-installer $previousInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBEXI-Discovery-Windows-x64
          path: |
            dist/OpenBEXIDiscovery-1.1.0-Windows-x64-Setup.exe
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30
