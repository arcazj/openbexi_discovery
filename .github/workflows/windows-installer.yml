name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'installer/**'
      - 'scripts/build_windows.py'
      - 'scripts/sign_windows.py'
      - 'scripts/test_windows_install.py'
      - 'backend/**'
      - 'tests/**'
      - 'assets/**'
      - 'themes/**'
      - 'templates/**'
      - 'prompts/runtime/**'
      - 'schemas/**'
      - 'documentation/**'
      - 'requirements.lock.txt'
      - 'index.html'
      - 'licenses/**'
      - '*.md'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            installer/requirements-build.txt
      - run: python -m pip install -r requirements.lock.txt -r installer/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Build Windows installer
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ vars.OPENBEXI_REQUIRE_SIGNING }}
        run: |
          if ($env:REQUIRE_SIGNING -eq 'true') {
            python -m scripts.build_windows --require-signing
          } else {
            python -m scripts.build_windows
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m scripts.test_windows_install
      - name: Download the previous V1.2.0 installer
        id: previous-installer
        shell: pwsh
        run: |
          $previousDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/windows/previous'
          New-Item -ItemType Directory -Path $previousDirectory -Force | Out-Null
          $previousName = 'OpenBEXIDiscovery-1.2.0-Windows-x64-Setup.exe'
          $previousInstaller = Join-Path $previousDirectory $previousName
          $previousChecksum = Join-Path $previousDirectory 'SHA256SUMS-Windows.txt'
          $previousRelease = 'https://github.com/arcazj/openbexi_discovery/releases/download/v1.2.0/'
          try {
            Invoke-WebRequest -Uri ($previousRelease + $previousName) -OutFile $previousInstaller -ErrorAction Stop
            Invoke-WebRequest -Uri ($previousRelease + 'SHA256SUMS-Windows.txt') -OutFile $previousChecksum -ErrorAction Stop
            'use_artifact=false' >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host 'Previous release download unavailable; use its verified Windows build artifact.'
            'use_artifact=true' >> $env:GITHUB_OUTPUT
          }
      - name: Recover the previous installer from its verified build
        if: steps.previous-installer.outputs.use_artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: OpenBEXI-Discovery-Windows-x64
          path: build/windows/previous
          github-token: ${{ github.token }}
          # Original 1.2.0 build, retained independently of release/tag deletion.
          run-id: 38171600551
      - name: Verify upgrade from V1.2.0
        shell: pwsh
        run: |
          $previousDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/windows/previous'
          $previousName = 'OpenBEXIDiscovery-1.2.0-Windows-x64-Setup.exe'
          $previousInstaller = Join-Path $previousDirectory $previousName
          $previousChecksum = Join-Path $previousDirectory 'SHA256SUMS-Windows.txt'
          $expected = (Get-Content -LiteralPath $previousChecksum -Raw).Trim() -split '\s+'
          if ($expected.Count -ne 2 -or $expected[1] -ne $previousName) { throw 'Unexpected previous installer checksum contents.' }
          $actualHash = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash
          if ($actualHash -ne $expected[0]) { throw 'Previous installer checksum mismatch.' }
          python -m scripts.test_windows_install --previous-installer $previousInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBEXI-Discovery-Windows-x64
          path: |
            dist/OpenBEXIDiscovery-1.2.1-Windows-x64-Setup.exe
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30
